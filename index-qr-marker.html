<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code AR Marker Tracking</title>

    <!-- AR.js and A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .instructions {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 9999;
            text-align: center;
            max-width: 90%;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 9998;
        }
    </style>
</head>

<body>
    <div class="instructions">
        Point your camera at the Hiro marker to see the 3D model
    </div>

    <div class="loading" id="loading">
        <h3>Loading AR Experience...</h3>
        <p>Please allow camera access</p>
    </div>

    <!-- AR Scene -->
    <a-scene embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false">

        <!-- Camera -->
        <a-entity camera></a-entity>

        <!-- Marker - Using Hiro pattern (most common) -->
        <a-marker preset="hiro">
            <!-- 3D Model Entity -->
            <a-entity gltf-model="url(model_1.glb)" scale="0.5 0.5 0.5" position="0 0.5 0" rotation="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-entity>
        </a-marker>

        <!-- Custom QR/Barcode Marker (alternative) -->
        <!-- Uncomment this and comment out the Hiro marker above to use barcode -->
        <!--
        <a-marker type="barcode" value="0">
            <a-entity
                gltf-model="url(model_1.glb)"
                scale="0.5 0.5 0.5"
                position="0 0.5 0">
            </a-entity>
        </a-marker>
        -->
    </a-scene>

    <script>
        // Hide loading screen when AR is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }, 2000);
        });

        // Log marker detection
        const marker = document.querySelector('a-marker');
        if (marker) {
            marker.addEventListener('markerFound', () => {
                console.log('Marker detected!');
            });

            marker.addEventListener('markerLost', () => {
                console.log('Marker lost');
            });
        }
    </script>
</body>

</html>
