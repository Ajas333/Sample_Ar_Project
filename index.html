<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Testing Menu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .ar-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 25px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .ar-button:active {
      transform: scale(0.98);
    }

    .button-content {
      flex: 1;
    }

    .button-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
    }

    .button-desc {
      font-size: 13px;
      opacity: 0.8;
      display: block;
    }

    .button-icon {
      font-size: 24px;
      margin-left: 15px;
    }

    /* Button 1 - Lightweight Test */
    .btn-test {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-test:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      transform: translateY(-2px);
    }

    /* Button 2 - Debug Mode */
    .btn-debug {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .btn-debug:hover {
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
      transform: translateY(-2px);
    }

    /* Button 3 - Main AR */
    .btn-main {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
    }

    .btn-main:hover {
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
      transform: translateY(-2px);
    }

    /* Button 4 - Simple Test */
    .btn-simple {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      color: white;
    }

    .btn-simple:hover {
      box-shadow: 0 6px 20px rgba(250, 112, 154, 0.4);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #666;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .ar-button {
        padding: 18px 20px;
      }

      .button-title {
        font-size: 16px;
      }

      .button-desc {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎯 AR Testing Menu</h1>
    <p class="subtitle">Choose a version to test your AR experience</p>

    <div class="button-group">
      <!-- Button 1: Lightweight Test -->
      <a href="test-lightweight.html" class="ar-button btn-test">
        <div class="button-content">
          <span class="button-title">🧪 Lightweight Test</span>
        </div>
        <span class="button-icon">→</span>
      </a>

      <!-- Button 2: Debug Mode -->
      <a href="index-debug.html" class="ar-button btn-debug">
        <div class="button-content">
          <span class="button-title">🔍 Debug Mode</span>
          <span class="button-desc">model with diagnostic logs</span>
        </div>
        <span class="button-icon">→</span>
      </a>

      <!-- Button 3: Simplified Test -->
      <a href="test-simple.html" class="ar-button btn-simple">
        <div class="button-content">
          <span class="button-title">⚡ Simplified Test</span>
        </div>
        <span class="button-icon">→</span>
      </a>

      <!-- Button 4: Main AR -->
      <a href="menu.html" class="ar-button btn-main">
        <div class="button-content">
          <span class="button-title">🚀 Main AR Experience<span class="badge">LIVE</span></span>
          <span class="button-desc">Production version</span>
        </div>
        <span class="button-icon">→</span>
      </a>
    </div>
  </div>
</body>

</html>
