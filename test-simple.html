<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Test - Fixed</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #f0f0f0;
        }

        model-viewer::part(default-ar-button) {
            background-color: #FF5722;
            color: white;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 10px;
            bottom: 30px;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 87, 34, 0.95);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .info p {
            margin: 5px 0;
            font-size: 13px;
        }

        .status {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 200;
        }
    </style>
</head>

<body>
    <div class="info">
        <h2>🎯 AR Test (Simplified)</h2>
        <p><strong>Your Model: 8.5MB</strong></p>
        <p>Tap the AR button below ↓</p>
    </div>

    <div class="status" id="status">Initializing...</div>

    <model-viewer src="mode_2.glb" alt="3D Model" ar ar-modes="scene-viewer webxr quick-look" camera-controls
        auto-rotate interaction-prompt="none">

        <button slot="ar-button" style="
            background-color: #FF5722;
            color: white;
            padding: 20px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        ">
            🚀 TAP TO START AR
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const status = document.querySelector('#status');

        function updateStatus(msg, color = '#fff') {
            status.textContent = msg;
            status.style.background = color === '#fff' ? 'rgba(0,0,0,0.8)' : color;
            console.log(msg);
        }

        updateStatus('Loading model...');

        modelViewer.addEventListener('load', () => {
            updateStatus('✅ Model loaded! Tap AR button', 'rgba(0,200,0,0.8)');
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        });

        modelViewer.addEventListener('error', (event) => {
            updateStatus('❌ Model failed to load', 'rgba(200,0,0,0.8)');
            console.error('Error:', event);
        });

        modelViewer.addEventListener('ar-status', (event) => {
            console.log('AR Status:', event.detail.status);

            if (event.detail.status === 'session-started') {
                updateStatus('✅ AR Started!', 'rgba(0,200,0,0.8)');
            } else if (event.detail.status === 'failed') {
                updateStatus('❌ AR Failed - Try lightweight test', 'rgba(200,0,0,0.8)');
            } else if (event.detail.status === 'not-presenting') {
                updateStatus('⏳ Click AR button again...', 'rgba(255,150,0,0.8)');
            }
        });

        // Log AR support
        setTimeout(() => {
            console.log('AR Supported:', modelViewer.canActivateAR);
        }, 1000);
    </script>
</body>

</html>
